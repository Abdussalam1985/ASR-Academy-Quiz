<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASR ACADEMY - Class 5 English Tense Exam Generator</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f4f4f9;
            color: #000;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            background: #fff;
            margin: 0 auto;
            padding: 30px;
            border: 1px solid #ccc;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        .header {
            text-align: center;
            border-bottom: 2px solid #000;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
            text-transform: uppercase;
        }

        .header h2 {
            margin: 5px 0 0;
            font-size: 18px;
            font-weight: normal;
        }

        .info-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 25px;
            font-weight: bold;
            font-size: 15px;
            border-bottom: 1px dashed #666;
            padding-bottom: 10px;
        }

        .student-info {
            margin-bottom: 25px;
            font-size: 14px;
        }

        .student-info p {
            margin: 5px 0;
        }

        .question-card {
            margin-bottom: 20px;
            page-break-inside: avoid;
        }

        .question-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            padding-left: 20px;
        }

        .option-item {
            font-size: 15px;
        }

        .action-buttons {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #ccc;
        }

        .btn {
            background-color: #222;
            color: #fff;
            border: none;
            padding: 10px 18px;
            font-size: 15px;
            cursor: pointer;
            margin: 5px;
            border-radius: 4px;
        }

        .btn:hover {
            background-color: #444;
        }

        .btn-green {
            background-color: #2e7d32;
        }
        .btn-green:hover {
            background-color: #1b5e20;
        }

        .answer-key {
            display: none;
            margin-top: 30px;
            padding: 15px;
            background-color: #f9f9f9;
            border: 1px solid #ddd;
        }

        .answer-key h3 {
            margin-top: 0;
        }

        @media print {
            body {
                background-color: #fff;
                padding: 0;
            }

            .container {
                border: none;
                box-shadow: none;
                padding: 0;
                width: 100%;
            }

            .action-buttons {
                display: none;
            }

            .answer-key {
                page-break-before: always;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>ASR ACADEMY</h1>
        <h2>Class 5 English Grammar — Tense Paper Exam</h2>
    </div>

    <div class="info-bar">
        <span>Time: 15 Minutes</span>
        <span id="setTag">Set: Auto-Generated</span>
        <span>Full Marks: 10</span>
    </div>

    <div class="student-info">
        <p><strong>Student's Name:</strong> _____________________________________</p>
        <p><strong>Roll No:</strong> ______________ &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <strong>Date:</strong> ______________</p>
    </div>

    <form id="quizForm"></form>

    <div class="action-buttons">
        <button class="btn btn-green" onclick="generateNewExam()">🔄 Generate New Set (নতুন সেট তৈরি করুন)</button>
        <button class="btn" onclick="window.print()">🖨️ Print / Save as PDF</button>
        <button class="btn" onclick="toggleAnswers()">🔑 Show / Hide Answers</button>
    </div>

    <div class="answer-key" id="answerKey">
        <h3>Answer Key (উত্তরমালা):</h3>
        <div id="answerList"></div>
    </div>
</div>

<script>
    // এখানে আপনার ৩০টি প্রশ্ন অন্তর্ভুক্ত করা রয়েছে
    const allQuestions = [
        { q: "She _____ to school every day.", options: ["go", "goes", "went", "going"], ans: 1, type: "Present Simple" },
        { q: "They _____ football yesterday.", options: ["play", "plays", "played", "playing"], ans: 2, type: "Past Simple" },
        { q: "I _____ a storybook now.", options: ["am reading", "read", "was reading", "will read"], ans: 0, type: "Present Continuous" },
        { q: "We _____ Dhaka tomorrow.", options: ["visit", "visited", "will visit", "are visiting"], ans: 2, type: "Future Simple" },
        { q: "The sun _____ in the east.", options: ["rise", "rises", "rose", "is rising"], ans: 1, type: "Universal Truth" },
        { q: "He _____ his homework just now.", options: ["finished", "has finished", "is finishing", "finish"], ans: 1, type: "Present Perfect" },
        { q: "Birds _____ in the sky.", options: ["fly", "flies", "flew", "flying"], ans: 0, type: "Present Simple" },
        { q: "It _____ raining since morning.", options: ["is", "was", "has been", "will be"], ans: 2, type: "Present Perfect Continuous" },
        { q: "She _____ a song when I called her.", options: ["sang", "was singing", "sings", "is singing"], ans: 1, type: "Past Continuous" },
        { q: "Father _____ us to the park next Sunday.", options: ["take", "took", "will take", "is taking"], ans: 2, type: "Future Simple" },
        { q: "Rina _____ milk every night before sleeping.", options: ["drinks", "drink", "drank", "drinking"], ans: 0, type: "Present Simple" },
        { q: "Look! The baby _____ happily.", options: ["smile", "smiled", "is smiling", "was smiling"], ans: 2, type: "Present Continuous" },
        { q: "We _____ to Cox's Bazar last month.", options: ["go", "went", "have gone", "will go"], ans: 1, type: "Past Simple" },
        { q: "I _____ my meal already.", options: ["eat", "ate", "have eaten", "will eat"], ans: 2, type: "Present Perfect" },
        { q: "He _____ a new computer next week.", options: ["buys", "bought", "will buy", "is buying"], ans: 2, type: "Future Simple" },
        { q: "When I reached home, mother _____ dinner.", options: ["cooks", "was cooking", "is cooking", "cooked"], ans: 1, type: "Past Continuous" },
        { q: "Water _____ at 100 degrees Celsius.", options: ["boil", "boils", "boiled", "is boiling"], ans: 1, type: "Universal Truth" },
        { q: "They _____ in this house for five years.", options: ["live", "lived", "have been living", "are living"], ans: 2, type: "Present Perfect Continuous" },
        { q: "Did you _____ the doctor yesterday?", options: ["see", "saw", "seen", "seeing"], ans: 0, type: "Past Simple" },
        { q: "Listen! Someone _____ at the door.", options: ["knocks", "knocked", "is knocking", "was knocking"], ans: 2, type: "Present Continuous" },
        { q: "He _____ never seen a tiger before.", options: ["has", "have", "had", "is"], ans: 0, type: "Present Perfect" },
        { q: "My brother _____ a bicycle tomorrow.", options: ["gets", "got", "will get", "is getting"], ans: 2, type: "Future Simple" },
        { q: "The earth _____ round the sun.", options: ["move", "moves", "moved", "is moving"], ans: 1, type: "Universal Truth" },
        { q: "While we were playing, it _____ to rain.", options: ["starts", "started", "was starting", "is starting"], ans: 1, type: "Past Simple" },
        { q: "She _____ her lesson right now.", options: ["prepares", "is preparing", "prepared", "will prepare"], ans: 1, type: "Present Continuous" },
        { q: "I _____ him for ten years.", options: ["know", "knew", "have known", "am knowing"], ans: 2, type: "Present Perfect" },
        { q: "They _____ a project next term.", options: ["start", "started", "will start", "have started"], ans: 2, type: "Future Simple" },
        { q: "He always _____ the truth.", options: ["speak", "speaks", "spoke", "is speaking"], ans: 1, type: "Present Simple" },
        { q: "We _____ television when the light went out.", options: ["watch", "watched", "were watching", "are watching"], ans: 2, type: "Past Continuous" },
        { q: "The train _____ before we reached the station.", options: ["left", "had left", "has left", "leaves"], ans: 1, type: "Past Perfect" }
    ];

    let currentQuestions = [];

    function generateNewExam() {
        // প্রশ্নগুলো উলটপালট (Shuffle) করার কোড
        const shuffled = [...allQuestions].sort(() => 0.5 - Math.random());
        currentQuestions = shuffled.slice(0, 10); // প্রথম ১০টি নির্বাচন করা হলো

        const quizForm = document.getElementById('quizForm');
        const answerList = document.getElementById('answerList');
        quizForm.innerHTML = '';
        answerList.innerHTML = '';

        // র‍্যান্ডম সেট কোড
        const setCode = String.fromCharCode(65 + Math.floor(Math.random() * 26)) + Math.floor(100 + Math.random() * 900);
        document.getElementById('setTag').innerText = "Set Code: " + setCode;

        const optionLabels = ["A", "B", "C", "D"];

        currentQuestions.forEach((item, index) => {
            // প্রশ্ন সাজানো
            const qCard = document.createElement('div');
            qCard.className = 'question-card';
            
            let optionsHTML = '';
            item.options.forEach((opt, optIndex) => {
                optionsHTML += `
                    <div class="option-item">
                        <label><input type="radio" name="q${index}"> ${optionLabels[optIndex]}) ${opt}</label>
                    </div>
                `;
            });

            qCard.innerHTML = `
                <div class="question-title">${index + 1}. ${item.q} <small style="font-weight:normal; font-size:12px; color:#555;">(${item.type})</small></div>
                <div class="options-grid">${optionsHTML}</div>
            `;
            quizForm.appendChild(qCard);

            // উত্তরপত্র সাজানো
            const ansP = document.createElement('p');
            ansP.style.margin = "4px 0";
            ansP.innerHTML = `<strong>${index + 1}.</strong> ${optionLabels[item.ans]}) ${item.options[item.ans]}`;
            answerList.appendChild(ansP);
        });

        // উত্তরপত্র বন্ধ রাখা
        document.getElementById('answerKey').style.display = 'none';
    }

    function toggleAnswers() {
        const answerDiv = document.getElementById('answerKey');
        if (answerDiv.style.display === 'block') {
            answerDiv.style.display = 'none';
        } else {
            answerDiv.style.display = 'block';
        }
    }

    // প্রথমবার পেজ লোড হলেই অটোমেটিক একটি সেট তৈরি হবে
    window.onload = generateNewExam;
</script>

</body>
</html>
